<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="template:media-width" content="1024">
  <meta name="template:media-height" content="1024">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <style>
    :root {
      --bg: #fdf9f3;
      --card: #ffffff;
      --ink: #3d3530;
      --ink-soft: #8a7d72;
      --accent: #e8855d;       /* warm terracotta */
      --accent-soft: #f6c8a8;  /* soft peach */
      --accent-pale: #fbeadd;
      --shadow: rgba(61, 53, 48, 0.10);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .frame {
      position: relative;
      width: 1080px;
      height: 1920px;
      box-sizing: border-box;
      padding: 90px 70px 70px 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 56px;
      z-index: 1;
    }

    /* ============ Soft background ============ */
    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
    }

    .blob-1 {
      width: 520px;
      height: 520px;
      top: -180px;
      right: -160px;
      background: radial-gradient(circle, var(--accent-pale) 0%, transparent 70%);
    }

    .blob-2 {
      width: 460px;
      height: 460px;
      bottom: -140px;
      left: -150px;
      background: radial-gradient(circle, rgba(246, 200, 168, 0.45) 0%, transparent 70%);
    }

    /* Little sun in the corner */
    .sun {
      position: absolute;
      top: 110px;
      right: 100px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-soft);
    }

    .sun::before {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 3px dashed rgba(232, 133, 93, 0.35);
    }

    /* Sprinkled dots */
    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-soft);
      opacity: 0.7;
    }

    .dot.d1 { top: 18%; left: 80px; }
    .dot.d2 { top: 42%; right: 60px; width: 14px; height: 14px; opacity: 0.5; }
    .dot.d3 { bottom: 24%; left: 60px; width: 12px; height: 12px; opacity: 0.5; }
    .dot.d4 { bottom: 12%; right: 110px; }

    /* ============ Header ============ */
    .header {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 30px;
      background: var(--accent-pale);
      border-radius: 999px;
      font-size: 26px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 3px;
    }

    .badge .heart {
      font-size: 24px;
    }

    .title {
      margin: 0;
      max-width: 860px;
      font-size: 66px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 1px;
      color: var(--ink);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .title-wave {
      width: 220px;
      height: 14px;
      color: var(--accent-soft);
    }

    /* ============ Photo card ============ */
    .photo-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      background: var(--card);
      border-radius: 36px;
      padding: 24px;
      box-sizing: border-box;
      box-shadow: 0 24px 60px var(--shadow);
    }

    .photo-card img {
      width: 100%;
      height: 860px;
      object-fit: cover;
      border-radius: 24px;
      display: block;
    }

    /* Soft tape strips for a scrapbook feel */
    .tape {
      position: absolute;
      width: 150px;
      height: 42px;
      background: rgba(246, 200, 168, 0.65);
      border-radius: 6px;
      z-index: 2;
    }

    .tape.left  { top: -16px; left: 70px;  transform: rotate(-6deg); }
    .tape.right { top: -16px; right: 70px; transform: rotate(5deg); }

    /* ============ Caption ============ */
    .caption {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 880px;
      text-align: center;
    }

    .caption p {
      margin: 0;
      font-size: 44px;
      line-height: 1.7;
      font-weight: 500;
      color: var(--ink);
      overflow-wrap: anywhere;
      word-break: break-word;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .caption-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
    }

    .caption-divider .line {
      width: 70px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent-soft);
    }

    .caption-divider .mid {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ============ Footer ============ */
    .footer {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 880px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-top: 30px;
      border-top: 2px solid var(--accent-pale);
    }

    .author {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .author-name {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 30px;
      font-weight: 600;
      color: var(--ink);
    }

    .author-name::before {
      content: '';
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
    }

    .author-desc {
      font-size: 22px;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .brand-name {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--ink-soft);
    }

    .brand-dots {
      display: flex;
      gap: 6px;
    }

    .brand-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-soft);
    }

    .brand-dots span.on {
      background: var(--accent);
    }

    * { text-rendering: optimizeLegibility; }
  </style>
</head>
<body>
  <div class="frame">
    <!-- Soft background -->
    <div class="bg-layer" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="sun"></div>
      <div class="dot d1"></div>
      <div class="dot d2"></div>
      <div class="dot d3"></div>
      <div class="dot d4"></div>
    </div>

    <!-- Header -->
    <header class="header">
      <div class="badge"><span class="heart">☀</span>DAILY MOMENTS</div>
      <h1 class="title">{{title}}</h1>
      <svg class="title-wave" viewBox="0 0 220 14" fill="none" aria-hidden="true">
        <path d="M2 7 Q 15 1, 28 7 T 54 7 T 80 7 T 106 7 T 132 7 T 158 7 T 184 7 T 210 7"
              stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </header>

    <!-- Photo card -->
    <section class="photo-card" role="img" aria-label="Illustration for the video">
      <div class="tape left"></div>
      <div class="tape right"></div>
      <img src="{{image}}" alt="Image: {{title}}">
    </section>

    <!-- Caption -->
    <section class="caption" role="region" aria-label="Narration">
      <p>{{text}}</p>
      <div class="caption-divider" aria-hidden="true">
        <div class="line"></div>
        <div class="mid"></div>
        <div class="line"></div>
      </div>
    </section>

    <!-- Footer -->
    <!-- <footer class="footer" role="contentinfo">
      <div class="author">
        <div class="author-name">{{author=@Pixelle.AI}}</div>
        <div class="author-desc">{{describe=Open Source Omnimodal AI Creative Agent}}</div>
      </div>
      <div class="brand">
        <div class="brand-name">{{brand=Pixelle-Video}}</div>
        <div class="brand-dots" aria-hidden="true">
          <span class="on"></span><span class="on"></span><span></span><span></span>
        </div>
      </div>
    </footer> -->
  </div>
</body>
</html>
