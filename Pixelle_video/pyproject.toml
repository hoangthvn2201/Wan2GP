[project]
name = "pixelle-video"
version = "0.1.15"
description = "AI-powered video creation platform - Part of Pixelle ecosystem"
authors = [
    {name = "Pixelle.AI"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
# NOTE: when running inside the Wan2GP repository with the in-process wan2gp
# backend (see WAN2GP_BACKEND.md), do NOT install this project standalone.
# Install once into the Wan2GP environment instead:
#   pip install -r ../requirements.txt -r requirements.txt
# The list below is kept for standalone (ComfyUI/RunningHub-only) usage.
dependencies = [
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "edge-tts==7.2.7",
    "certifi>=2025.10.5",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28.1",
    "pillow>=10.0.0,<12",
    "streamlit>=1.40.0",
    "openai>=2.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "comfykit>=0.1.12",
    "beautifulsoup4>=4.14.2",
    "moviepy==1.0.3",
    "playwright>=1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]
# Vietnamese TTS (VieNeu-TTS). Mirrors requirements-vieneu.txt — see that
# file for build prerequisites (cmake, Rust) and why vieneu itself must be
# installed with `pip install vieneu==2.7.0 --no-deps` (its gradio>=5.49.1 /
# CPU onnxruntime pins clash with Wan2GP's gradio==5.29.0 / onnxruntime-gpu).
vieneu = [
    "sea-g2p>=0.7.5",
    "llama-cpp-python==0.3.16",
    "resemble-perth>=1.0.1",
    "numpy",
    "soundfile",
    "librosa>=0.11.0",
    "huggingface_hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
