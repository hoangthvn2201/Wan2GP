# Pixelle-Video Configuration
# Copy this file to config.yaml and fill in your settings
# ⚠️ Never commit config.yaml to Git!

project_name: Pixelle-Video

# ==================== LLM Configuration ====================
# Supports any OpenAI SDK compatible API
llm:
  api_key: ""
  base_url: ""
  model: ""

# Popular presets:
# Qwen Max:        base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  model: "qwen-max"
# OpenAI GPT-4o:   base_url: "https://api.openai.com/v1"                          model: "gpt-4o"
# DeepSeek:        base_url: "https://api.deepseek.com"                           model: "deepseek-chat"
# Ollama (Local):  base_url: "http://localhost:11434/v1"                          model: "llama3.2"

# ==================== ComfyUI Configuration ====================
comfyui:
  # Global ComfyUI settings
  comfyui_url: http://127.0.0.1:8188  # ComfyUI server URL (required for selfhost workflows)
  comfyui_api_key: ""  # ComfyUI API key (optional, get from https://platform.comfy.org/profile/api-keys)
  # Note for Docker users: Use host.docker.internal:8188 (Mac/Windows) or host IP address (Linux)
  runninghub_api_key: ""  # RunningHub API key (required for runninghub workflows)
  runninghub_concurrent_limit: 1  # Concurrent execution limit for RunningHub (1-10, default 1 for regular members)
  
  # TTS-specific configuration
  tts:
    # Inference mode: local (Edge TTS, online, free) | vieneu (VieNeu-TTS,
    # local Vietnamese voices, on-device) | comfyui (workflow-based)
    inference_mode: local
    local:
      voice: zh-CN-YunjianNeural
      speed: 1.2
    # VieNeu-TTS (Vietnamese, https://github.com/pnnbao97/VieNeu-TTS)
    # Install first: pip install -r Pixelle_video/requirements-vieneu.txt
    #                pip install vieneu==2.7.0 --no-deps
    # For mode "max" also install the max-quality extras documented in
    # requirements-vieneu.txt (neucodec, torchtune, torchao, local-attention).
    vieneu:
      # Preset voices: Xuân Vĩnh (Nam - Miền Nam), Phạm Tuyên (Nam - Miền Bắc),
      #                Bích Ngọc (Nữ - Miền Bắc), Thục Đoan (Nữ - Miền Nam)
      # Names are fuzzy-matched (e.g. "Tuyen" resolves to Phạm Tuyên)
      voice: Xuân Vĩnh (Nam - Miền Nam)
      speed: 1.0         # Speed multiplier 0.5-2.0 (pitch-preserving time stretch)
      ref_audio: null    # Optional 3-5s wav/mp3 for zero-shot voice cloning (overrides voice)
      ref_text: null     # Transcript of ref_audio — required for cloning in max/standard modes
      # Quality tier, each falls back to the next if its deps/GPU are missing:
      #   max      = full-precision VieNeu-TTS-v2 backbone + full NeuCodec (best quality,
      #              GPU recommended, supports high-fidelity cloning with ref_text)
      #   standard = Q4 GGUF backbone + int8 ONNX codec (good quality, no extra deps,
      #              no voice cloning)
      #   turbo    = Turbo GGUF model (fastest, lowest quality, audio-only cloning)
      mode: max
      device: cuda       # cpu or cuda (falls back to cpu if CUDA unavailable)
    comfyui:
      default_workflow: selfhost/tts_edge.json  # TTS workflow to use
  
  # Image-specific configuration
  image:
    # Required: Default workflow to use (no fallback)
    # Options: wan2gp/image_qwen.json (recommended, in-process, no server needed)
    #          runninghub/image_flux.json (cloud, no local setup)
    #          selfhost/image_flux.json (requires local ComfyUI)
    default_workflow: wan2gp/image_qwen.json
    
    # Image prompt prefix (optional)
    prompt_prefix: "Minimalist black-and-white matchstick figure style illustration, clean lines, simple sketch style"
  
  # Video-specific configuration
  video:
    # Required: Default workflow to use (no fallback)
    # Options: wan2gp/video_wan2.1_fusionx.json (recommended, in-process, no server needed)
    #          runninghub/video_wan2.1_fusionx.json (cloud, no local setup)
    #          selfhost/video_wan2.1_fusionx.json (requires local ComfyUI)
    default_workflow: wan2gp/video_wan2.1_fusionx.json
    
    # Video prompt prefix (optional)
    prompt_prefix: "Minimalist black-and-white matchstick figure style illustration, clean lines, simple sketch style"

# ==================== Wan2GP Configuration ====================
# In-process model loading through the WanGP Python API (no ComfyUI server).
# Used by workflows under workflows/wan2gp/*.json. Models are downloaded
# automatically by WanGP on first use and stay loaded in VRAM between frames.
wan2gp:
  # Path to the Wan2GP installation. Leave empty to auto-detect
  # (Pixelle_video lives inside the Wan2GP repository).
  root: null
  # WanGP startup flags, same as wgp.py command line.
  # e.g. ["--attention", "sdpa", "--profile", "4"]
  cli_args: []
  # Optional override for WanGP's output folder (default: WanGP outputs/)
  output_dir: null

# ==================== Template Configuration ====================
# Configure default template for video generation
template:
  # Default frame template to use when not explicitly specified
  # Determines video aspect ratio and layout style
  # Template naming convention:
  #   - static_*.html: Static style templates (no AI-generated media)
  #   - image_*.html: Templates requiring AI-generated images
  #   - video_*.html: Templates requiring AI-generated videos
  # Options: 
  #   - 1080x1920 (vertical/portrait): image_default.html, image_modern.html, image_elegant.html, static_simple.html, etc.
  #   - 1080x1080 (square): image_minimal_framed.html, etc.
  #   - 1920x1080 (horizontal/landscape): image_film.html, image_full.html, etc.
  # See templates/ directory for all available templates
  default_template: "1080x1920/image_default.html"
